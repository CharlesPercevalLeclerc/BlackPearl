<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackPearl | Sales Counter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: #16161a;
            --accent: #3b82f6;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.6;
        }

        /* Background Glow */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 70%);
            z-index: -1;
        }

        .container { width: 100%; max-width: 600px; margin: 60px auto; }

        /* Floating Nav Buttons */
        .nav-btn {
            position: fixed;
            top: 20px;
            z-index: 1000;
            background: var(--card-bg);
            border: 1px solid #333;
            color: white;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .btn-home { left: 20px; text-decoration: none; }
        .btn-top { right: 20px; display: none; } /* Hidden by default */
        .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; }
        header h1 span { color: var(--accent); }
        header p { color: var(--text-dim); font-size: 0.9rem; }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid #262626;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.8rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #0f0f12;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .btn-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        
        button {
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-calc { background: var(--accent); color: white; grid-column: span 2; margin-bottom: 5px; }
        .btn-copy { background: #334155; color: white; }
        .btn-wa { background: #059669; color: white; }
        .btn-clear { background: transparent; color: var(--danger); border: 1px solid var(--danger); grid-column: span 2; margin-top: 10px; font-size: 0.8rem; }
        
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        button:active { transform: scale(0.98); }

        #output {
            margin-top: 25px;
            background: #000;
            color: #10b981;
            padding: 20px;
            border-radius: 15px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            display: none;
            font-size: 0.85rem;
            border: 1px dashed #333;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        hr { border: 0; border-top: 1px solid #262626; margin: 25px 0; }

        footer { text-align: center; margin: 40px 0; font-size: 0.8rem; color: var(--text-dim); }

        /* Responsive Mobile */
        @media (max-width: 480px) {
            header h1 { font-size: 1.5rem; }
            .grid { grid-template-columns: 1fr; }
            .container { margin-top: 80px; }
        }
    </style>
</head>
<body>

    <a href="../index.html" class="nav-btn btn-home">
        <i data-lucide="arrow-left"></i>
    </a>

    <button class="nav-btn btn-top" id="backToTop" onclick="scrollToTop()">
        <i data-lucide="arrow-up"></i>
    </button>

    <div class="container">
        <header>
            <h1>BLACK<span>PEARL</span> SALES</h1>
            <p>Input data harian lo di bawah ini</p>
        </header>

        <div class="card">
            <div class="input-group">
                <label>📍 Nama Toko</label>
                <input type="text" id="namaToko" placeholder="Masukkan nama toko...">
            </div>

            <div class="grid">
                <div class="input-group">
                    <label>Sales shift 1</label>
                    <input type="tel" id="s1" class="num" inputmode="numeric" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Sales shift 2</label>
                    <input type="tel" id="s2" class="num" inputmode="numeric" placeholder="0">
                </div>
            </div>

            <div class="grid">
                <div class="input-group">
                    <label>Struk Shift 1</label>
                    <input type="tel" id="st1" class="num" inputmode="numeric" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Struk Shift 2</label>
                    <input type="tel" id="st2" class="num" inputmode="numeric" placeholder="0">
                </div>
            </div>

            <hr>

            <div class="grid">
                <div class="input-group">
                    <label>AKM Sales Kemarin</label>
                    <input type="tel" id="akmSalesLalu" class="num" inputmode="numeric" placeholder="0">
                </div>
                <div class="input-group">
                    <label>AKM Struk Kemarin</label>
                    <input type="tel" id="akmStrukLalu" class="num" inputmode="numeric" placeholder="0">
                </div>
            </div>

            <div class="grid">
                <div class="input-group">
                    <label>Target SPD</label>
                    <input type="tel" id="targetSpd" class="num" inputmode="numeric" placeholder="0">
                </div>
                <div class="input-group">
                    <label>SPD Lalu</label>
                    <input type="tel" id="spdLalu" class="num" inputmode="numeric" placeholder="0">
                </div>
            </div>

            <div class="grid">
                <div class="input-group">
                    <label>STD Lalu</label>
                    <input type="tel" id="stdLalu" class="num" inputmode="numeric" placeholder="0">
                </div>
                <div class="input-group">
                    <label>APC Lalu</label>
                    <input type="tel" id="apcLalu" class="num" inputmode="numeric" placeholder="0">
                </div>
            </div>

            <div class="btn-box">
                <button class="btn-calc" onclick="generate()">
                    <i data-lucide="zap"></i> PROSES DATA
                </button>
                <button class="btn-copy" onclick="copy()">
                    <i data-lucide="copy"></i> SALIN
                </button>
                <button class="btn-wa" onclick="sendWA()">
                    <i data-lucide="message-circle"></i> WHATSAPP
                </button>
                <button class="btn-clear" onclick="clearFields()">
                    <i data-lucide="trash-2"></i> Clear All Data
                </button>
            </div>
        </div>

        <div id="output"></div>

        <footer>
            BlackPearl System &copy; 2026
        </footer>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Format Ribuan & Keyboard Logic
        document.querySelectorAll('.num').forEach(inp => {
            inp.addEventListener('input', function() {
                let v = this.value.replace(/\D/g, "");
                this.value = v.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            });
        });

        // Show/Hide Back to Top
        window.onscroll = function() {
            const btn = document.getElementById("backToTop");
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                btn.style.display = "flex";
            } else {
                btn.style.display = "none";
            }
        };

        function scrollToTop() {
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function parse(id) {
            return parseFloat(document.getElementById(id).value.replace(/\./g, "")) || 0;
        }

        function fmt(n) {
            return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function clearFields() {
            if(confirm("Hapus semua data input?")) {
                document.querySelectorAll('input').forEach(i => i.id !== 'namaToko' ? i.value = "" : null);
                document.getElementById('output').style.display = 'none';
            }
        }

        function calculate() {
            const tgl = new Date();
            const d = tgl.getDate();
            const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
            const fullTgl = `${d} ${months[tgl.getMonth()]} ${tgl.getFullYear()}`;
            
            const sls = parse('s1') + parse('s2');
            const stk = parse('st1') + parse('st2');
            const apc = stk > 0 ? Math.round(sls / stk) : 0;
            
            const akmS = sls + parse('akmSalesLalu');
            const akmSt = stk + parse('akmStrukLalu');
            
            const ach = parse('targetSpd') > 0 ? Math.round((sls/parse('targetSpd'))*100) : 0;
            
            const spdNow = Math.round(akmS / d);
            const growSpd = parse('spdLalu') > 0 ? Math.round(((spdNow/parse('spdLalu'))*100)-100) : 0;
            
            const stdNow = Math.round(akmSt / d);
            const growStd = parse('stdLalu') > 0 ? Math.round(((stdNow/parse('stdLalu'))*100)-100) : 0;
            
            const apcNow = stdNow > 0 ? Math.round(spdNow / stdNow) : 0;
            const growApc = parse('apcLalu') > 0 ? Math.round(((apcNow/parse('apcLalu'))*100)-100) : 0;

            const sign = (v) => v > 0 ? "+" : "";

            return `LAPORAN HARIAN 
Toko : ${document.getElementById('namaToko').value || '-'}
Tgl : ${fullTgl}

Sls Net : ${fmt(sls)}
Struk : ${fmt(stk)}
Apc : ${fmt(apc)}

AKM Sales : ${fmt(akmS)}
Target SPD : ${fmt(parse('targetSpd'))}
Ach : ${ach}%

SPD Sekarang : ${fmt(spdNow)}
SPD Lalu : ${fmt(parse('spdLalu'))}
Growth : ${sign(growSpd)}${growSpd}%

STD Sekarang : ${fmt(stdNow)}
STD Lalu : ${fmt(parse('stdLalu'))}
Growth : ${sign(growStd)}${growStd}%

APC Sekarang : ${fmt(apcNow)}
APC Lalu : ${fmt(parse('apcLalu'))}
Growth : ${sign(growApc)}${growApc}%

Target tarik tunai perday : 9
Akm tarik tunai :
SPD tarik tunai :

Target new member I-SAKU :
Pencapaian : 0
Target new member point ku :
Pencapaian : 0
Target new member klik :
Pencapaian : 0`;
        }

        function generate() {
            const res = calculate();
            const out = document.getElementById('output');
            out.innerText = res;
            out.style.display = 'block';
            out.scrollIntoView({behavior: "smooth"});
        }

        function copy() {
            const txt = document.getElementById('output').innerText;
            if(!txt) return alert("Proses data dulu!");
            navigator.clipboard.writeText(txt).then(() => alert("✅ Berhasil Disalin!"));
        }

        function sendWA() {
            const txt = document.getElementById('output').innerText;
            if(!txt) return alert("Proses data dulu!");
            window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
        }
    </script>
</body>
</html>
