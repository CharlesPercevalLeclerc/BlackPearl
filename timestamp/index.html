<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackPearl | Pro Timestamp</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-dark: #0a0a0c; --card-bg: #16161a; --accent: #3b82f6;
            --text-main: #ffffff; --text-dim: #94a3b8; --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }
        
        /* Background Effect */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 70%); z-index: -1;
        }

        .nav-btn {
            position: fixed; top: 20px; left: 20px; z-index: 1000; background: var(--card-bg); 
            border: 1px solid #333; color: white; padding: 10px; border-radius: 12px;
            cursor: pointer; display: flex; align-items: center; text-decoration: none;
        }

        .container { width: 100%; max-width: 700px; margin: 60px auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 2rem; font-weight: 800; }
        header h1 span { color: var(--accent); }

        .card { 
            background: var(--card-bg); padding: 20px; border-radius: 20px; 
            border: 1px solid #262626; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        label { display: block; margin-bottom: 8px; font-size: 0.8rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; }
        input, select, textarea { 
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #333; 
            background: #0f0f12; color: white; margin-bottom: 15px; font-size: 0.95rem;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        #map { height: 250px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #333; }

        /* Search Results */
        .search-wrapper { position: relative; }
        #search-results { 
            position: absolute; width: 100%; background: #1f1f23; z-index: 1001; 
            border-radius: 10px; max-height: 200px; overflow-y: auto; 
        }
        .search-item { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; font-size: 0.85rem; }
        .search-item:hover { background: var(--accent); }

        .btn-main { 
            background: var(--accent); color: white; border: none; padding: 15px; 
            border-radius: 12px; font-weight: 800; width: 100%; cursor: pointer; 
            transition: 0.3s; font-size: 1.1rem;
        }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4); }

        canvas { width: 100%; border-radius: 15px; margin-top: 20px; border: 1px solid #333; display: none; }
        
        .cropper-container { max-height: 400px !important; margin-bottom: 15px; }

        @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<a href="../index.html" class="nav-btn"><i data-lucide="arrow-left"></i></a>

<div class="container">
    <header>
        <h1>BLACK<span>PEARL</span> STAMP</h1>
        <p>Fake Timestamp Pro Generator</p>
    </header>

    <div class="card">
        <label><i data-lucide="image"></i> Pilih Foto</label>
        <input type="file" id="upload" accept="image/*">
        <div id="img-wrapper" style="display:none;"><img id="image" style="max-width: 100%;"></div>
    </div>

    <div class="card">
        <label><i data-lucide="map-pin"></i> Lokasi & Alamat</label>
        <div class="search-wrapper">
            <input type="text" id="addr-search" placeholder="Cari lokasi...">
            <div id="search-results"></div>
        </div>
        <div id="map"></div>
        <textarea id="address" rows="3" placeholder="Detail alamat..."></textarea>
    </div>

    <div class="card">
        <label><i data-lucide="layout"></i> Kustomisasi Tampilan</label>
        <div class="grid">
            <div>
                <label>Template Style</label>
                <select id="templateStyle">
                    <option value="classic">Classic White (Default)</option>
                    <option value="modern_blue">Modern Electric Blue</option>
                    <option value="minimal_bold">Minimalist Bold</option>
                    <option value="orange_label">Orange Safety Label</option>
                    <option value="hacker_green">Matrix Hacker Green</option>
                </select>
            </div>
            <div>
                <label>Warna Font</label>
                <input type="color" id="fontColor" value="#ffffff">
            </div>
            <div>
                <label>Ukuran Font</label>
                <select id="fontSize">
                    <option value="0.8">Kecil</option>
                    <option value="1" selected>Normal</option>
                    <option value="1.3">Besar</option>
                    <option value="1.6">Sangat Besar</option>
                </select>
            </div>
            <div>
                <label>Waktu</label>
                <input type="datetime-local" id="timestamp">
            </div>
        </div>
    </div>

    <button id="process-btn" class="btn-main">GENERATE STAMP</button>

    <div id="result-area" style="text-align: center;">
        <canvas id="canvas-preview"></canvas>
        <div id="download-area" style="margin-top: 20px;"></div>
    </div>

    <footer style="text-align: center; margin-top: 30px; color: var(--text-dim); font-size: 0.8rem;">
        BlackPearl System &copy; 2026 | Created with 🔥
    </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let cropper, map, marker;
lucide.createIcons();

// --- MAP LOGIC ---
map = L.map('map').setView([-6.2000, 106.8166], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
marker = L.marker([-6.2000, 106.8166], {draggable: true}).addTo(map);

const addrSearch = document.getElementById('addr-search');
const resultsDiv = document.getElementById('search-results');

addrSearch.addEventListener('input', async function() {
    if (this.value.length < 3) return;
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${this.value}&limit=5`);
    const data = await res.json();
    resultsDiv.innerHTML = '';
    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'search-item';
        div.innerText = item.display_name;
        div.onclick = () => {
            map.setView([item.lat, item.lon], 17);
            marker.setLatLng([item.lat, item.lon]);
            document.getElementById('address').value = item.display_name;
            resultsDiv.innerHTML = '';
        };
        resultsDiv.appendChild(div);
    });
});

marker.on('dragend', async () => {
    const pos = marker.getLatLng();
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.lat}&lon=${pos.lng}`);
    const data = await res.json();
    document.getElementById('address').value = data.display_name;
});

// --- CROPPER LOGIC ---
document.getElementById('upload').onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = document.getElementById('image');
            img.src = event.target.result;
            document.getElementById('img-wrapper').style.display = 'block';
            if (cropper) cropper.destroy();
            cropper = new Cropper(img, { aspectRatio: 3/4, viewMode: 1 });
        };
        reader.readAsDataURL(file);
    }
};

// Set Now
const now = new Date();
now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
document.getElementById('timestamp').value = now.toISOString().slice(0,16);

// --- DRAWING ENGINE ---
document.getElementById('process-btn').onclick = function() {
    if (!cropper) return alert("Upload foto dulu!");

    const canvas = document.getElementById('canvas-preview');
    const ctx = canvas.getContext('2d');
    const targetWidth = 1080;
    const targetHeight = 1440; // 3:4 ratio

    canvas.width = targetWidth;
    canvas.height = targetHeight;
    canvas.style.display = 'block';

    ctx.drawImage(cropper.getCroppedCanvas(), 0, 0, targetWidth, targetHeight);

    const dateObj = new Date(document.getElementById('timestamp').value);
    const jam = dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false });
    const tanggal = dateObj.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
    const hari = dateObj.toLocaleDateString('id-ID', { weekday: 'long' });
    const alamat = document.getElementById('address').value;
    
    // CUSTOMIZATION PARAMS
    const selectedTemplate = document.getElementById('templateStyle').value;
    const userColor = document.getElementById('fontColor').value;
    const scale = parseFloat(document.getElementById('fontSize').value);
    const baseSize = (targetWidth / 20) * scale;

    ctx.textAlign = "left";
    ctx.shadowBlur = 4;
    ctx.shadowColor = "rgba(0,0,0,0.5)";

    let startX = targetWidth * 0.05;
    let startY = targetHeight - (baseSize * 4);

    // TEMPLATE LOGIC
    if(selectedTemplate === "hacker_green") ctx.fillStyle = "#00ff00";
    else if(selectedTemplate === "modern_blue") ctx.fillStyle = "#3b82f6";
    else if(selectedTemplate === "orange_label") ctx.fillStyle = "#ff9800";
    else ctx.fillStyle = userColor;

    if(selectedTemplate === "minimal_bold") {
        ctx.font = `900 ${baseSize * 2.5}px Inter`;
        ctx.fillText(jam, startX, startY);
        startY += (baseSize * 1.2);
        ctx.font = `600 ${baseSize * 0.6}px Inter`;
        ctx.fillText(`${hari}, ${tanggal}`, startX, startY);
    } else {
        // DEFAULT / CLASSIC STYLE
        ctx.font = `bold ${baseSize * 2.2}px sans-serif`;
        ctx.fillText(jam, startX, startY);
        
        let jamWidth = ctx.measureText(jam).width;
        ctx.font = `bold ${baseSize * 0.7}px sans-serif`;
        ctx.fillText(tanggal, startX + jamWidth + 15, startY - (baseSize * 0.8));
        ctx.font = `${baseSize * 0.6}px sans-serif`;
        ctx.fillText(hari, startX + jamWidth + 15, startY);
    }

    // DRAW ALAMAT
    startY += (baseSize * 1);
    ctx.font = `${baseSize * 0.45}px sans-serif`;
    const words = alamat.split(' ');
    let line = '';
    for(let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > targetWidth * 0.8) {
            ctx.fillText(line, startX, startY);
            line = words[n] + ' ';
            startY += (baseSize * 0.6);
        } else { line = testLine; }
    }
    ctx.fillText(line, startX, startY);

    // DOWNLOAD LINK
    const downloadArea = document.getElementById('download-area');
    const link = document.createElement('a');
    link.download = `BlackPearl_Stamp_${Date.now()}.jpg`;
    link.href = canvas.toDataURL('image/jpeg', 0.9);
    link.innerHTML = '<button class="btn-main" style="background:#10b981">💾 DOWNLOAD FOTO</button>';
    downloadArea.innerHTML = '';
    downloadArea.appendChild(link);
    
    canvas.scrollIntoView({ behavior: 'smooth' });
};
</script>
</body>
</html>
