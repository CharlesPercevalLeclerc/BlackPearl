<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackPearl | Pro Timestamp</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { 
            --bg-dark: #0a0a0c; 
            --card-bg: rgba(22, 22, 26, 0.8); 
            --accent: #3b82f6; 
            --text-main: #f8fafc; 
            --text-dim: #94a3b8;
            --border-color: #262626;
            --input-bg: #0f172a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Background Gradient sesuai Landing Page */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 70%);
            z-index: -1;
        }

        /* Header Gaya Classic (Sesuai Foto) */
        .hero-section {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 40px;
        }
        .hero-section h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .hero-section h1 span { color: #3b82f6; }
        .hero-section p {
            color: var(--text-dim);
            font-size: 1rem;
            margin-top: 5px;
            font-weight: 500;
        }

        /* Main Container */
        .main-container {
            width: 100%;
            max-width: 800px;
        }

        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 25px; 
            margin-bottom: 20px; 
            backdrop-filter: blur(10px);
        }

        label { 
            display: flex; align-items: center; gap: 8px; font-size: 0.85rem; 
            color: var(--text-main); margin-bottom: 15px; 
            font-weight: 700;
        }
        
        input, select, textarea { 
            width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #334155; 
            background: var(--input-bg); color: var(--text-main); font-size: 0.95rem; 
            margin-bottom: 15px;
        }

        #map { height: 250px; border-radius: 10px; border: 1px solid #334155; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .btn { 
            background: var(--accent); color: white; border: none; padding: 18px; 
            border-radius: 10px; font-weight: 800; width: 100%; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 10px; 
            font-size: 1rem; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-loc { background: #059669; font-size: 0.75rem; padding: 12px; margin-bottom: 15px; }

        /* Result Area */
        #preview-container { margin-top: 30px; display: grid; gap: 30px; width: 100%; }
        .result-item { 
            background: var(--card-bg); padding: 15px; border-radius: 12px; 
            border: 1px solid var(--border-color);
        }
        canvas { width: 100%; border-radius: 8px; display: block; }
        .dl-btn { 
            background: #4f46e5; color: white; text-decoration: none; display: block; 
            padding: 15px; border-radius: 8px; text-align: center; margin-top: 15px; 
            font-weight: 700;
        }

        /* Back Button Floating */
        .back-nav {
            position: absolute; top: 20px; left: 20px;
        }
        .back-link { color: var(--text-dim); text-decoration: none; font-size: 1.5rem; }
    </style>
</head>
<body>

<div class="back-nav">
    <a href="../index.html" class="back-link"><i data-lucide="arrow-left"></i></a>
</div>

<div class="hero-section">
    <h1>BLACK<span>PEARL</span> STAMP</h1>
    <p>Fake Timestamp Pro Generator</p>
</div>

<div class="main-container">
    <div class="card">
        <label><i data-lucide="image"></i> PILIH FOTO</label>
        <input type="file" id="bulk-input" accept="image/*" multiple>
    </div>

    <div class="card">
        <label><i data-lucide="map-pin"></i> SET LOKASI</label>
        <button class="btn btn-loc" id="get-geo"><i data-lucide="navigation"></i> GUNAKAN GPS LOKASI SAYA</button>
        <div id="map"></div>
        <textarea id="address" rows="3" placeholder="Detail alamat..."></textarea>
    </div>

    <div class="card">
        <label><i data-lucide="settings"></i> KONFIGURASI TEMPLATE</label>
        <div class="grid">
            <div>
                <select id="t-style">
                    <option value="modern">Modern Default</option>
                    <option value="elegant">Elegant Badge</option>
                    <option value="polaroid">Polaroid Style</option>
                    <option value="glass">Glassmorphism</option>
                    <option value="outline">Bold Outline</option>
                </select>
            </div>
            <div>
                <select id="t-font">
                    <option value="Inter">Inter UI</option>
                    <option value="'JetBrains Mono'">Mono Space</option>
                    <option value="'Oswald'">Oswald Bold</option>
                </select>
            </div>
        </div>
        <div class="grid">
            <input type="color" id="t-color" value="#ffffff">
            <input type="datetime-local" id="t-time">
        </div>
        <div class="grid">
            <div><small>Brightness</small><input type="range" id="f-br" min="50" max="150" value="100"></div>
            <div><small>Contrast</small><input type="range" id="f-ct" min="50" max="150" value="100"></div>
        </div>
    </div>

    <button class="btn" id="generate-all"><i data-lucide="zap"></i> GENERATE SEKARANG</button>

    <div id="preview-container"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
lucide.createIcons();

// --- MAP LOGIC ---
let map = L.map('map').setView([-6.20, 106.81], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let marker = L.marker([-6.20, 106.81]).addTo(map);

map.on('click', (e) => {
    marker.setLatLng(e.latlng);
    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${e.latlng.lat}&lon=${e.latlng.lng}`)
        .then(r => r.json())
        .then(d => { document.getElementById('address').value = d.display_name; });
});

document.getElementById('get-geo').onclick = () => {
    navigator.geolocation.getCurrentPosition(p => {
        const {latitude, longitude} = p.coords;
        map.setView([latitude, longitude], 17);
        marker.setLatLng([latitude, longitude]);
        map.fire('click', {latlng: {lat: latitude, lng: longitude}});
    });
};

// --- CORE LOGIC ---
let imageFiles = [];
document.getElementById('bulk-input').onchange = (e) => { imageFiles = [...e.target.files]; };

const now = new Date();
now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
document.getElementById('t-time').value = now.toISOString().slice(0,16);

document.getElementById('generate-all').onclick = () => {
    if(!imageFiles.length) return alert("Pilih foto dulu bos!");
    const container = document.getElementById('preview-container');
    container.innerHTML = '<p style="text-align:center;">Memproses...</p>';
    
    setTimeout(() => {
        container.innerHTML = '';
        imageFiles.forEach((file, i) => {
            const reader = new FileReader();
            reader.onload = (e) => drawImage(e.target.result, i);
            reader.readAsDataURL(file);
        });
    }, 100);
};

function drawImage(src, index) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    
    img.onload = () => {
        canvas.width = 1200; canvas.height = 1600;
        const scale = Math.max(canvas.width / img.width, canvas.height / img.height);
        const x = (canvas.width / 2) - (img.width / 2) * scale;
        const y = (canvas.height / 2) - (img.height / 2) * scale;
        
        ctx.filter = `brightness(${document.getElementById('f-br').value}%) contrast(${document.getElementById('f-ct').value}%)`;
        ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
        ctx.filter = 'none';

        const timeInput = new Date(document.getElementById('t-time').value);
        const txtJam = timeInput.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
        const txtTgl = timeInput.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}).toUpperCase();
        const txtAlamat = document.getElementById('address').value || "Location Unknown";
        
        applyTemplate(ctx, document.getElementById('t-style').value, document.getElementById('t-font').value, document.getElementById('t-color').value, txtJam, txtTgl, txtAlamat);

        // Watermark Verified
        ctx.fillStyle = "rgba(255,255,255,0.4)";
        ctx.font = "italic 25px Inter";
        ctx.textAlign = 'right';
        ctx.fillText("BlackPearl Verified", canvas.width - 40, canvas.height - 30);
        ctx.textAlign = 'left';

        const div = document.createElement('div');
        div.className = 'result-item';
        div.innerHTML = `<a class="dl-btn" href="${canvas.toDataURL('image/jpeg', 0.9)}" download="BP_${index+1}.jpg">DOWNLOAD HASIL ${index+1}</a>`;
        div.prepend(canvas);
        document.getElementById('preview-container').appendChild(div);
    };
    img.src = src;
}

function applyTemplate(ctx, s, f, c, jam, tgl, alm) {
    ctx.fillStyle = c;
    ctx.shadowBlur = 12; ctx.shadowColor = "rgba(0,0,0,0.9)";
    const margin = 60; const maxWidth = 1080;

    const wrapText = (text, x, y, lineHeight, maxW) => {
        let words = text.split(' '); let line = '';
        for (let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            if (ctx.measureText(testLine).width > maxW && n > 0) {
                ctx.fillText(line, x, y); line = words[n] + ' '; y += lineHeight;
            } else { line = testLine; }
        }
        ctx.fillText(line, x, y);
    };

    if(s === 'polaroid') {
        ctx.shadowBlur = 0; ctx.fillStyle = "white"; ctx.fillRect(0, 1300, 1200, 300);
        ctx.fillStyle = "#111"; ctx.font = `bold 100px ${f}`; ctx.fillText(jam, margin, 1420);
        ctx.font = `45px ${f}`; ctx.fillText(tgl, margin, 1480);
        ctx.font = `30px ${f}`; wrapText(alm, margin, 1530, 40, maxWidth);
    } else if(s === 'elegant') {
        ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(600, 1280, 550, 270);
        ctx.fillStyle = c; ctx.font = `bold 90px ${f}`; ctx.fillText(jam, 630, 1380);
        ctx.font = `bold 40px ${f}`; ctx.fillText(tgl, 630, 1430);
        ctx.font = `26px ${f}`; wrapText(alm, 630, 1470, 35, 500);
    } else {
        ctx.font = `bold 110px ${f}`; ctx.fillText(jam, margin, 1400);
        ctx.font = `bold 50px ${f}`; ctx.fillText(tgl, margin, 1470);
        ctx.font = `32px ${f}`; wrapText(alm, margin, 1530, 45, maxWidth);
    }
}
</script>
</body>
</html>
