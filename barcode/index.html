<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackPearl | Smart Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c; --card: #16161a; --accent: #3b82f6; --text: #ffffff;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        .search-box {
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #333;
            background: var(--card); color: white; font-size: 1rem; outline: none;
            transition: 0.3s;
        }
        .search-box:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }

        .results-list { margin-top: 20px; }
        .product-item {
            background: var(--card); padding: 15px; border-radius: 12px;
            margin-bottom: 10px; border: 1px solid #262626;
            animation: fadeIn 0.3s ease;
        }
        .product-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 5px; display: block; }
        .product-info { font-size: 0.8rem; color: #94a3b8; display: flex; justify-content: space-between; }
        .highlight { color: var(--accent); font-weight: bold; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; margin-bottom: 20px;">📦 SMART<span>SEARCH</span></h2>
    
    <input type="text" id="searchInput" class="search-box" placeholder="Cari: mie sedaap 5...">
    
    <div id="results" class="results-list">
        </div>
</div>

<script>
    // 1. DATABASE JSON (Contoh)
    const database = [
        { id: "1001", nama: "Sedaap Mie Instant Goreng 5X91g", harga: "Rp 15.500" },
        { id: "1002", nama: "Indomie Goreng Spesial 85g", harga: "Rp 3.100" },
        { id: "1003", nama: "Sedaap Mie Kuah Soto 75g", harga: "Rp 3.000" },
        { id: "1004", nama: "Minyak Goreng Filma 2L", harga: "Rp 34.000" },
        { id: "1005", nama: "Sedaap Mie Singapore Spicy Laksa 5X83g", harga: "Rp 16.000" }
    ];

    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('results');

    // 2. FUNGSI PENCARIAN "TIDAK KAKU" (TOKEN MATCHING)
    function smartFilter(query) {
        if (!query) return [];

        // Pecah query jadi potongan kata, buang spasi kosong
        // Contoh: "Mie sedaap 5" -> ["mie", "sedaap", "5"]
        const tokens = query.toLowerCase().split(/\s+/).filter(t => t.length > 0);

        return database.filter(item => {
            const namaProduk = item.nama.toLowerCase();
            
            // Logika: Apakah SETIAP potongan kata (token) ada di dalam nama produk?
            // Tidak peduli urutannya, yang penting semua kata masuk.
            return tokens.every(token => namaProduk.includes(token));
        });
    }

    // 3. FUNGSI UPDATE TAMPILAN (UI)
    function renderResults(data) {
        resultsContainer.innerHTML = "";

        if (data.length === 0) {
            if (searchInput.value !== "") {
                resultsContainer.innerHTML = `<p style="text-align:center; color:#666;">Produk tidak ditemukan...</p>`;
            }
            return;
        }

        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'product-item';
            div.innerHTML = `
                <span class="product-name">${item.nama}</span>
                <div class="product-info">
                    <span>ID: ${item.id}</span>
                    <span style="color: #10b981; font-weight:bold;">${item.harga}</span>
                </div>
            `;
            resultsContainer.appendChild(div);
        });
    }

    // 4. EVENT LISTENER
    searchInput.addEventListener('input', (e) => {
        const query = e.target.value;
        const hasil = smartFilter(query);
        renderResults(hasil);
    });
</script>

</body>
</html>
