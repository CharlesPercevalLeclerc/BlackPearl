<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackPearl | IDM Inventory Scan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="../style.css">

    <style>
        body { padding: 20px; }
        .tool-container { max-width: 500px; margin: 0 auto; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid #262626; margin-bottom: 20px; }
        label { display: block; margin-bottom: 12px; font-size: 0.7rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        /* Scanner */
        #reader { width: 100%; border-radius: 15px; overflow: hidden; background: #000; display: none; margin-bottom: 15px; border: 1px solid #333 !important; }
        .cam-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn-cam { padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 800; font-size: 0.8rem; }
        #start-cam { background: #10b981; color: white; }
        #stop-cam { background: #ef4444; color: white; display: none; }

        /* Search */
        input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #333; background: #0f0f12; color: white; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--accent); }

        /* Results */
        #search-results { max-height: 250px; overflow-y: auto; margin-top: 10px; }
        .result-item { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 15px; border: 1px solid transparent; }
        .result-item:hover { border-color: var(--accent); background: rgba(255,255,255,0.08); }
        .result-item img { width: 45px; height: 45px; border-radius: 8px; background: white; object-fit: contain; }

        /* Detail Area */
        .product-detail-card { text-align: center; margin-bottom: 20px; }
        .big-image { width: 150px; height: 150px; background: white; border-radius: 15px; padding: 10px; object-fit: contain; margin: 0 auto 15px; display: block; }
        
        .barcode-display { background: #fff; padding: 25px; border-radius: 15px; margin: 20px 0; display: none; flex-direction: column; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #barcodeCanvas { max-width: 100%; height: auto; }
        .barcode-meta { color: #000; font-weight: 800; font-size: 0.75rem; margin-top: 10px; font-family: monospace; }

        .back-home { display: inline-flex; align-items: center; gap: 8px; color: var(--text-dim); text-decoration: none; font-size: 0.85rem; margin-bottom: 25px; }
        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-save { background: var(--accent); color: white; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="tool-container">
        <a href="../index.html" class="back-home"><i data-lucide="arrow-left" size="18"></i> Back to Dashboard</a>

        <header style="text-align: center; margin-bottom: 30px;">
            <div class="logo">BLACK<span>PEARL</span></div>
            <p style="color: var(--text-dim); font-size: 0.7rem; letter-spacing: 1px;">IDM QTY GENERATOR</p>
        </header>

        <div class="card">
            <label>Kamera Scanner</label>
            <div class="cam-controls">
                <button id="start-cam" class="btn-cam" onclick="startScanner()">ON</button>
                <button id="stop-cam" class="btn-cam" onclick="stopScanner()">OFF</button>
            </div>
            <div id="reader"></div>
        </div>

        <div class="card">
            <label>Cari Produk</label>
            <input type="text" id="searchInput" placeholder="Nama atau PLU..." oninput="doSearch(this.value)">
            <div id="search-results"></div>

            <div id="detail-area" style="display: none; border-top: 1px solid #333; margin-top: 20px; padding-top: 20px;">
                <div class="product-detail-card">
                    <img id="detail-img" class="big-image" src="" alt="Produk">
                    <div id="selected-info" style="font-weight: 800; color: var(--accent); font-size: 1.1rem;"></div>
                    <div id="selected-plu" style="font-size: 0.8rem; color: var(--text-dim); margin-top: 5px;"></div>
                </div>
                
                <label>Jumlah (QTY)</label>
                <input type="number" id="qtyInput" value="1" min="1" oninput="generateFinalBarcode()">

                <div class="barcode-display" id="barcodeDisplay">
                    <canvas id="barcodeCanvas"></canvas>
                    <div id="barcodeText" class="barcode-meta"></div>
                </div>

                <button class="btn-action btn-save" onclick="downloadBarcode()">
                    <i data-lucide="download" size="18"></i> SIMPAN BARCODE
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const html5QrCode = new Html5Qrcode("reader");
        let database = [];
        let activeProduct = null;

        async function initData() {
            try {
                const response = await fetch('barcode-db.json?v=' + Date.now());
                database = await response.json();
            } catch (err) { console.error("Database error"); }
        }
        initData();

        function startScanner() {
            document.getElementById('reader').style.display = "block";
            document.getElementById('start-cam').style.display = "none";
            document.getElementById('stop-cam').style.display = "block";
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
                document.getElementById('searchInput').value = decodedText;
                doSearch(decodedText);
                stopScanner();
            });
        }

        function stopScanner() {
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = "none";
                document.getElementById('start-cam').style.display = "block";
                document.getElementById('stop-cam').style.display = "none";
            });
        }

        function doSearch(val) {
            const resultsBox = document.getElementById('search-results');
            const query = val.toLowerCase().trim();
            if (query.length < 2) { resultsBox.innerHTML = ""; return; }

            const filtered = database.filter(item => 
                `${item.name} ${item.plu}`.toLowerCase().includes(query)
            ).slice(0, 5);

            resultsBox.innerHTML = filtered.map(item => `
                <div class="result-item" onclick="selectItem('${item.plu}')">
                    <img src="https://cdn-klik.klikindomaret.com/klik-catalog/product/${item.plu}_1.jpg" onerror="this.src='https://via.placeholder.com/100?text=No+Img'">
                    <div class="result-info">
                        <div class="p-name">${item.name}</div>
                        <div class="p-plu">PLU: ${item.plu}</div>
                    </div>
                </div>
            `).join('');
        }

        function selectItem(plu) {
            activeProduct = database.find(i => i.plu == plu);
            if (!activeProduct) return;

            document.getElementById('search-results').innerHTML = "";
            document.getElementById('searchInput').value = activeProduct.name;
            document.getElementById('detail-area').style.display = "block";
            
            // Tampilkan Gambar & Info
            document.getElementById('detail-img').src = `https://cdn-klik.klikindomaret.com/klik-catalog/product/${activeProduct.plu}_1.jpg`;
            document.getElementById('selected-info').innerText = activeProduct.name;
            document.getElementById('selected-plu').innerText = "PLU: " + activeProduct.plu;

            generateFinalBarcode();
        }

        function generateFinalBarcode() {
            if (!activeProduct) return;
            
            const qtyInput = document.getElementById('qtyInput').value || 1;
            // REVISI LOGIKA: B + PLU + 4 Digit QTY
            const finalString = "B" + activeProduct.plu + qtyInput.toString().padStart(4, '0');
            
            document.getElementById('barcodeDisplay').style.display = "flex";
            document.getElementById('barcodeText').innerText = finalString;

            JsBarcode("#barcodeCanvas", finalString, {
                format: "CODE128",
                lineColor: "#000",
                width: 2,
                height: 80,
                displayValue: false
            });
        }

        function downloadBarcode() {
            const canvas = document.getElementById('barcodeCanvas');
            const finalCanvas = document.createElement('canvas');
            const ctx = finalCanvas.getContext('2d');
            finalCanvas.width = canvas.width + 60;
            finalCanvas.height = canvas.height + 80;
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
            ctx.drawImage(canvas, 30, 20);
            ctx.fillStyle = "black";
            ctx.font = "bold 16px Monospace";
            ctx.textAlign = "center";
            ctx.fillText(document.getElementById('barcodeText').innerText, finalCanvas.width/2, finalCanvas.height - 20);
            
            const link = document.createElement('a');
            link.href = finalCanvas.toDataURL("image/png");
            link.download = `${document.getElementById('barcodeText').innerText}.png`;
            link.click();
        }
    </script>
</body>
</html>
